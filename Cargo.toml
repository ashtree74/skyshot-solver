[package]
name = "skyshot-solver"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "Offline blind plate solving with stellar dominance fingerprints"
default-run = "skyshot"

[lib]
name = "skyshot"

[[bin]]
name = "skyshot"
path = "src/main.rs"

[features]
default = []
solver-debug = []

[dependencies]
anyhow = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff"] }
nalgebra = "0.33"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
libm = "0.2"
clap = { version = "4", features = ["derive"] }
memmap2 = "0.9"
sha2 = "0.10"
rstar = "0.12"

[dev-dependencies]
rand = "0.8"
rand_chacha = "0.3"
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.dev]
opt-level = 1
